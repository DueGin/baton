name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a pre-release) to build the desktop apps for
# macOS (arm64 + x64) and Windows (x64) and publish them as a GitHub Release.
# "Run workflow" (workflow_dispatch) builds the same artifacts without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            dist: dist:mac
          - name: Windows
            os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "packages/desktop/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }' "$VERSION"
          echo "Building version $VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: runner.os == 'macOS'
        run: npx vitest run
        env:
          BATON_HOME: ${{ runner.temp }}/baton-test-home

      - name: Package
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: baton-${{ matrix.name }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "baton $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
